name: DAI RUN CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: dai-run-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Pipeline
    runs-on: [self-hosted, cicd]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check runner environment
        run: |
          echo "Runner is working"
          hostname
          docker --version

      - name: Read image version
        run: |
          IMAGE_VERSION=$(cat VERSION)
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> "$GITHUB_ENV"
          echo "Image version is $IMAGE_VERSION"

      - name: SonarQube Scan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Build Docker image with commit SHA tag
        run: |
          docker build \
            -t "${{ secrets.HARBOR_URL }}/dai-run/dai-run:${{ github.sha }}" \
            .

      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ secrets.HARBOR_URL }}/dai-run/dai-run:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Tag version and latest image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            "${{ secrets.HARBOR_URL }}/dai-run/dai-run:${{ github.sha }}" \
            "${{ secrets.HARBOR_URL }}/dai-run/dai-run:${{ env.IMAGE_VERSION }}"

          docker tag \
            "${{ secrets.HARBOR_URL }}/dai-run/dai-run:${{ github.sha }}" \
            "${{ secrets.HARBOR_URL }}/dai-run/dai-run:latest"

      - name: Log in to Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" |
            docker login "${{ secrets.HARBOR_URL }}" \
              -u "${{ secrets.HARBOR_USERNAME }}" \
              --password-stdin

      - name: Push Docker image to Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ secrets.HARBOR_URL }}/dai-run/dai-run:${{ github.sha }}"
          docker push "${{ secrets.HARBOR_URL }}/dai-run/dai-run:${{ env.IMAGE_VERSION }}"
          docker push "${{ secrets.HARBOR_URL }}/dai-run/dai-run:latest"

  deploy:
    name: Deploy with Docker Compose
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cicd]

    steps:
      - name: Log in to Harbor for deploy
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" |
            docker login "${{ secrets.HARBOR_URL }}" \
              -u "${{ secrets.HARBOR_USERNAME }}" \
              --password-stdin

      - name: Deploy latest image with Docker Compose
        run: |
          cd ~/dai-run-deploy
          docker compose pull
          docker compose up -d
          docker compose ps
