name: DAI RUN CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI Pipeline
    runs-on: [self-hosted, cicd]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check runner environment
        run: |
          echo "Runner is working"
          hostname
          docker --version

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Build Docker image with commit SHA tag
        run: |
          docker build -t ${{ secrets.HARBOR_URL }}/dai-run/dai-run:${{ github.sha }} .

      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ secrets.HARBOR_URL }}/dai-run/dai-run:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: table
          exit-code: '0'

      - name: Tag latest image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ secrets.HARBOR_URL }}/dai-run/dai-run:${{ github.sha }} ${{ secrets.HARBOR_URL }}/dai-run/dai-run:latest

      - name: Log in to Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login "${{ secrets.HARBOR_URL }}" -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Push Docker image to Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.HARBOR_URL }}/dai-run/dai-run:${{ github.sha }}
          docker push ${{ secrets.HARBOR_URL }}/dai-run/dai-run:latest

  deploy:
    name: Deploy with Docker Compose
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cicd]

    steps:
      - name: Log in to Harbor for deploy
        run: echo "${{ secrets.HARBOR_PASSWORD }}" | docker login "${{ secrets.HARBOR_URL }}" -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Deploy latest image with Docker Compose
        run: |
          cd ~/dai-run-deploy
          docker compose pull
          docker compose up -d
          docker compose ps

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -fsS http://localhost:8080; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for service..."
            sleep 3
          done

          echo "Health check failed"
          cd ~/dai-run-deploy
          docker compose ps
          docker compose logs --tail=50
          exit 1
