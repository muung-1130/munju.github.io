server {
    listen 80;
    server_name _;

    # NEXTAUTH_URL이 https 하나로 고정돼 있어서 NextAuth가 발급하는 세션/CSRF 쿠키에는 항상
    # Secure 플래그가 붙는다 — 브라우저는 HTTPS 연결이 아니면 Secure 쿠키를 아예 저장하지 않으므로,
    # 이 포트로 그대로 로그인을 진행하면 서버는 성공 응답을 줘도 브라우저에 쿠키가 저장되지 않아
    # 로그인이 "조용히" 실패한다. 그래서 8080은 접속 자체를 막지 않고 8443(https)로 넘겨준다.
    return 301 https://$host:8443$request_uri;
}

# 자체서명 인증서 — 위치 인식(Geolocation) 등 브라우저가 secure context를 요구하는 API가
# 순수 IP+HTTP origin(192.168.0.212:8080)에서는 동작하지 않아서 추가했다. 브라우저에 "안전하지
# 않음" 경고가 뜨는데, 도메인+공인 인증서(Let's Encrypt 등)로 옮기기 전까지 임시로 감내한다.
server {
    listen 443 ssl;
    server_name _;

    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    resolver 127.0.0.11 valid=10s;

    include /etc/nginx/locations.conf;
}
