server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Docker 내장 DNS(127.0.0.11)로 매 요청마다 다시 resolve한다.
    # proxy_pass에 호스트명을 그대로 쓰면 nginx가 시작 시점의 IP를 캐싱해버려서,
    # frontend/backend 컨테이너를 재배포(재생성)하면 IP가 바뀌어도 계속 죽은 IP로 붙는다 —
    # 반드시 변수를 거쳐야 resolver가 매 요청마다 다시 적용된다.
    resolver 127.0.0.11 valid=10s;

    location /_next/static/ {
        set $frontend_upstream http://dai-run-frontend:3000;
        proxy_pass $frontend_upstream;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        set $frontend_upstream http://dai-run-frontend:3000;
        proxy_pass $frontend_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /api/ {
        set $backend_upstream http://dai-run-backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        set $frontend_upstream http://dai-run-frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
