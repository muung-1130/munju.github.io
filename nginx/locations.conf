    location /_next/static/ {
        set $frontend_upstream http://dai-run-frontend:3000;
        proxy_pass $frontend_upstream;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        set $frontend_upstream http://dai-run-frontend:3000;
        proxy_pass $frontend_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # next-auth의 [...nextauth] 카탈로그(session/signin/signout/callback/csrf/providers/error)만은
    # auth-web(Next.js, 옛 backend를 이 역할만 남기고 축소·개명)이 처리한다 — CSRF 이중 제출 쿠키와
    # JWT 인코딩이 next-auth v4의 Next.js 라우트 핸들러에 강하게 결합돼 있어, Express로 재구현하면
    # 이미 배포된 11개 MSA 서비스가 검증하는 next-auth.session-token 쿠키 형식과 어긋날 위험이 있다.
    # 아래 개별 서비스 location들이 /api/auth/ 보다 더 구체적(긴 prefix)이라 nginx가 먼저 매치시킨다.
    location /api/auth/signup {
        set $auth_upstream http://dai-run-auth-service:4000;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/auth/check-username {
        set $auth_upstream http://dai-run-auth-service:4000;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/auth/check-nickname {
        set $auth_upstream http://dai-run-auth-service:4000;
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /api/auth/find-username {
