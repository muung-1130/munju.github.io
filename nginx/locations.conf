    # next-auth 자체 경로(signin/signout/session/csrf/callback/*/providers/error) — 위의 구체적인
    # /api/auth/* 서비스 location들에 안 걸린 나머지가 여기로 온다.
    location /api/auth/ {
        set $authweb_upstream http://dai-run-auth-web:3000;
        proxy_pass $authweb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location = /api/health {
        set $authweb_upstream http://dai-run-auth-web:3000;
        proxy_pass $authweb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_upstream http://dai-run-frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
