services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dai-run-web-full-next:latest
    container_name: dai-run-next
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    networks:
      dai-run-net:
        aliases:
          - next-app
          - dai-run-next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: dai-run-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - dai-run-net

  course-stats-consumer:
    build:
      context: ./services/course-stats-consumer
      dockerfile: Dockerfile
    image: dai-run-course-stats-consumer:latest
    container_name: dai-run-course-stats-consumer
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - dai-run-net

  crew-notification-consumer:
    build:
      context: ./services/crew-notification-consumer
      dockerfile: Dockerfile
    image: dai-run-crew-notification-consumer:latest
    container_name: dai-run-crew-notification-consumer
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - dai-run-net

  crew-stats-scheduler:
    build:
      context: ./services/crew-stats-scheduler
      dockerfile: Dockerfile
    image: dai-run-crew-stats-scheduler:latest
    container_name: dai-run-crew-stats-scheduler
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - dai-run-net

  run-completion-consumer:
    build:
      context: ./services/run-completion-consumer
      dockerfile: Dockerfile
    image: dai-run-run-completion-consumer:latest
    container_name: dai-run-run-completion-consumer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: http://next-app:3000/api/internal/run-completed
    depends_on:
      - next-app
    networks:
      - dai-run-net

  nginx:
    image: nginx:1.27-alpine
    container_name: dai-run-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      next-app:
        condition: service_healthy
    networks:
      - dai-run-net

networks:
  dai-run-net:
    name: dai-run-net
    driver: bridge

volumes:
  mongo-data:
