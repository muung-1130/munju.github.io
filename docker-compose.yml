services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: dai-run-web-frontend:node20-min-v4
    container_name: dai-run-frontend
    restart: unless-stopped

    user: "10001:10001"
    init: true
    read_only: true

    env_file:
      - .env

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017
      OTEL_SERVICE_NAME: dai-run-frontend

    expose:
      - "3000"

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      dai-run-net:
        aliases:
          - frontend
          - dai-run-frontend

    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
      - apparmor=docker-default

    cap_drop:
      - ALL

    pids_limit: 200
    mem_limit: 1g
    cpus: 1.0

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
      - /app/.next/cache:rw,nosuid,nodev,size=128m,uid=10001,gid=10001

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -T
        - "3"
        - -O
        - /dev/null
        - http://127.0.0.1:3000/healthz
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-web:
    build:
      context: .
      dockerfile: Dockerfile.auth-web
    image: dai-run-auth-web:node20-min-v4
    container_name: dai-run-auth-web
    restart: unless-stopped

    user: "10001:10001"
    init: true
    read_only: true

    env_file:
      - .env

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017
      OTEL_SERVICE_NAME: dai-run-auth-web

    expose:
      - "3000"

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      dai-run-net:
        aliases:
          - auth-web
          - dai-run-auth-web

    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
      - apparmor=docker-default

    cap_drop:
      - ALL

    pids_limit: 200
    mem_limit: 1g
    cpus: 1.0

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
      - /app/.next/cache:rw,nosuid,nodev,size=128m,uid=10001,gid=10001

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -T
        - "3"
        - -O
        - /dev/null
        - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: dai-run-mongo
    restart: unless-stopped

    expose:
      - "27017"

    volumes:
      - mongo-data:/data/db

    networks:
      - dai-run-net

    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
      - apparmor=docker-default

    pids_limit: 300
    mem_limit: 1g
    cpus: 1.0

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  course-stats-consumer:
    build:
      context: ./services/course-stats-consumer
      dockerfile: Dockerfile
    image: dai-run-course-stats-consumer:node20-min-v4
    container_name: dai-run-course-stats-consumer
    restart: unless-stopped

    user: "10001:10001"
    init: true
    read_only: true

    env_file:
      - .env

    environment:
      OTEL_SERVICE_NAME: dai-run-course-stats-consumer

    networks:
      - dai-run-net

    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
      - apparmor=docker-default

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=1777

  crew-notification-consumer:
    build:
      context: ./services/crew-notification-consumer
      dockerfile: Dockerfile
    image: dai-run-crew-notification-consumer:node20-min-v4
    container_name: dai-run-crew-notification-consumer
    restart: unless-stopped

    user: "10001:10001"
    init: true
    read_only: true

    env_file:
      - .env

    environment:
      OTEL_SERVICE_NAME: dai-run-crew-notification-consumer

    networks:
      - dai-run-net

    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
      - apparmor=docker-default

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=1777

  crew-stats-scheduler:
    build:
      context: ./services/crew-stats-scheduler
      dockerfile: Dockerfile
    image: dai-run-crew-stats-scheduler:node20-min-v4
    container_name: dai-run-crew-stats-scheduler
    restart: unless-stopped

    user: "10001:10001"
    init: true
    read_only: true

    env_file:
      - .env

    environment:
      OTEL_SERVICE_NAME: dai-run-crew-stats-scheduler

    networks:
      - dai-run-net

    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
      - apparmor=docker-default

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=1777

  challenge-weekly-scheduler:
    build:
      context: ./services/challenge-weekly-scheduler
      dockerfile: Dockerfile
    image: dai-run-challenge-weekly-scheduler:node20-min-v4
    container_name: dai-run-challenge-weekly-scheduler
    restart: unless-stopped

    user: "10001:10001"
    init: true
    read_only: true

    env_file:
      - .env

    environment:
      OTEL_SERVICE_NAME: dai-run-challenge-weekly-scheduler

    networks:
      - dai-run-net

    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
      - apparmor=docker-default

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=1777

  run-completion-consumer:
    build:
      context: ./services/run-completion-consumer
      dockerfile: Dockerfile
    image: dai-run-run-completion-consumer:node20-min-v4
    container_name: dai-run-run-completion-consumer
    restart: unless-stopped

    user: "10001:10001"
    init: true
    read_only: true

    env_file:
      - .env

    environment:
      INTERNAL_API_URL: http://running-record-service:4000/api/internal/run-completed
      OTEL_SERVICE_NAME: dai-run-run-completion-consumer

    networks:
      - dai-run-net

    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
      - apparmor=docker-default

    cap_drop:
      - ALL

    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001,mode=1777

  nginx:
    image: nginx:1.27-alpine
    container_name: dai-run-nginx
    restart: unless-stopped

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/locations.conf:/etc/nginx/locations.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      frontend:
        condition: service_healthy
      auth-web:
        condition: service_healthy

    networks:
      - dai-run-net

    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
      - apparmor=docker-default

    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5

networks:
  dai-run-net:
    name: dai-run-net
    driver: bridge

volumes:
  mongo-data:
