services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dai-run-web-full-next:latest
    container_name: dai-run-next
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    ports:
      - "3000:3000"
    networks:
      dai-run-net:
        aliases:
          - next-app
          - dai-run-next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: dai-run-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      next-app:
        condition: service_healthy
    networks:
      - dai-run-net

networks:
  dai-run-net:
    name: dai-run-net
    driver: bridge
