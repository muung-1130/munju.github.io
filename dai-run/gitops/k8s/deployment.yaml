apiVersion: apps/v1
kind: Deployment
metadata:
  name: dairun-application
  namespace: dairun
  labels:
    app: dairun-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dairun-application
  template:
    metadata:
      labels:
        app: dairun-application
    spec:
      containers:
        - name: application
          image: 970307871446.dkr.ecr.ap-northeast-2.amazonaws.com/dairun/application:1e0f7c2d-7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20