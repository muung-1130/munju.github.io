apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dai-run-prod-ai
  namespace: dir-argocd-ns
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dai-run-prod
  source:
    repoURL: http://10.20.0.253/dai-run/gitops.git
    targetRevision: main
    path: environments/prod/ai
  destination:
    server: https://kubernetes.default.svc
    namespace: dir-ai-ns
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: dir-ai-assistant-consumer
      namespace: dir-ai-ns
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: dir-course-recommendation
      namespace: dir-ai-ns
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated: {enabled: true, prune: false, selfHeal: false, allowEmpty: false}
    retry:
      limit: 5
      backoff: {duration: 5s, factor: 2, maxDuration: 3m}
    syncOptions: [Validate=true, ApplyOutOfSyncOnly=true, RespectIgnoreDifferences=true]



