apiVersion: apps/v1
kind: Deployment
metadata:
  name: dai-run-challenge-service
  labels:
    app.kubernetes.io/name: dai-run-challenge-service
    app.kubernetes.io/part-of: dai-run
    app.kubernetes.io/component: challenge-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dai-run-challenge-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dai-run-challenge-service
        app.kubernetes.io/part-of: dai-run
        app.kubernetes.io/component: challenge-service
        dairun.io/track: blue
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-dai-run-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: challenge-service
          image: harbor.dai-run.internal/dai-run/challenge-service@sha256:ff819f0bd0528c0b09af5543f000ed46d7baef776dbd84c26978c6d6394ccc3d
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8108"
          ports:
            - name: http
              containerPort: 8108
              protocol: TCP
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
