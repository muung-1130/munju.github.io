apiVersion: apps/v1
kind: Deployment
metadata:
  name: dai-run-running-record-service
  labels:
    app.kubernetes.io/name: dai-run-running-record-service
    app.kubernetes.io/part-of: dai-run
    app.kubernetes.io/component: running-record-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dai-run-running-record-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dai-run-running-record-service
        app.kubernetes.io/part-of: dai-run
        app.kubernetes.io/component: running-record-service
        dairun.io/track: blue
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-dai-run-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: running-record-service
          image: harbor.dai-run.internal/dai-run/running-record-service@sha256:a964c80c6875bd3e68ab79d6ab44d68936359ec5621edc721f7fd636e8819c3e
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8103"
          ports:
            - name: http
              containerPort: 8103
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
