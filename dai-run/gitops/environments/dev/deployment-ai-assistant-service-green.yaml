apiVersion: apps/v1
kind: Deployment
metadata:
  name: dai-run-ai-assistant-service-green
  labels:
    app.kubernetes.io/name: dai-run-ai-assistant-service-green
    app.kubernetes.io/part-of: dai-run
    app.kubernetes.io/component: ai-assistant-service
    dairun.io/track: green
spec:
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dai-run-ai-assistant-service-green
      dairun.io/track: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dai-run-ai-assistant-service-green
        app.kubernetes.io/part-of: dai-run
        app.kubernetes.io/component: ai-assistant-service
        dairun.io/track: green
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-dai-run-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-assistant-service
          image: harbor.dai-run.internal/dai-run/ai-assistant-service@sha256:349d2b203072e0631aa206c10256c3ce31aea1de3c0127dd00410f5f93daa5e7
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8202"
            - name: AI_RAG_SERVICE_URL
              value: "http://dai-run-ai-rag-service.dir-gitops-test-ns.svc.dir-cluster:8000"
          ports:
            - name: http
              containerPort: 8202
              protocol: TCP
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL