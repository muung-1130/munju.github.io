apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: dir-ai-dashboard
    app.kubernetes.io/part-of: dai-run
  name: dir-ai-dashboard-config
  namespace: dir-frontend-ns
data:
  NODE_ENV: production
  HOSTNAME: "0.0.0.0"
  AWS_REGION: ap-northeast-2
  BEDROCK_MODEL_ID: apac.amazon.nova-pro-v1:0
  OTEL_RATE_WINDOW: 1h
  REAL_SERVER_NODE_EXPORTER_JOB: dir-master1-node-exporter
  PGHOST: dir-postgresql-rw.dir-db-ns.svc.cluster.local
  PGPORT: "5432"
  PGDATABASE: dai_run
  PGSSLMODE: no-verify
  LOKI_URL: http://dir-loki.dir-obsv-ns.svc.cluster.local:3100
  REDIS_HOST: dir-redis-svc.dir-db-ns.svc.cluster.local
  REDIS_PORT: "6379"
  # PROMETHEUS_URL / TEMPO_URL 없음 (의도적) — dir-obsv-ns를 직접 확인했더니
  # Loki(dir-loki)만 있고 Prometheus/Tempo Service는 존재하지 않음. 코드가
  # 이 두 값을 못 찾으면 그 기능만 안전하게 mock으로 폴백한다(크래시 없음).
