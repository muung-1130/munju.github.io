name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['portfolio/**', '.github/workflows/portfolio-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node portfolio/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
