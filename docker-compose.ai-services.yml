name: dai-run-ai-services

services:
  shoe-life-ai:
    build:
      context: ./shoe-life-ai
    container_name: dai-run-shoe-life-ai
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ./shoe-life-ai/.env
    environment:
      AWS_PROFILE: dai-run-bedrock
    volumes:
      - ${HOME}/.aws:/root/.aws:ro

  ai-rag-service:
    build:
      context: ./ai-rag-service
    container_name: dai-run-ai-rag-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./ai-rag-service/.env
    environment:
      AWS_PROFILE: dai-run-bedrock
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
