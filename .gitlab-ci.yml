stages:
  - test
  - quality
  - build

variables:
  AWS_DEFAULT_REGION: ap-northeast-2
  ECR_REGISTRY: 970307871446.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: dairun/application
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_IID"

runner-test:
  stage: test
  tags:
    - aws
    - eks
    - dairun
  script:
    - echo "DAI RUN GitLab Runner connected"
    - hostname
    - whoami
    - docker --version
    - aws --version

sonarqube-check:
  stage: quality
  tags:
    - aws
    - eks
    - dairun
  variables:
    GIT_DEPTH: "0"
  script:
    - >
      docker run --rm
      --network host
      -e SONAR_HOST_URL
      -e SONAR_TOKEN
      -e SONAR_USER_HOME=/tmp/.sonar
      -v "$CI_PROJECT_DIR:/usr/src"
      -w /usr/src
      sonarsource/sonar-scanner-cli:latest
      -Dsonar.qualitygate.wait=true

build-and-push:
  stage: build
  tags:
    - aws
    - eks
    - dairun
  script:
    - aws sts get-caller-identity
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    - echo "Pushed image $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
