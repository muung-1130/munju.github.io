stages:
  - validate
  - test
  - quality
  - deploy

variables:
  AWS_DEFAULT_REGION: ap-northeast-2
  ECR_REGISTRY: 970307871446.dkr.ecr.ap-northeast-2.amazonaws.com
  GITOPS_REPOSITORY_URL: http://10.20.0.253/dai-run/gitops.git
  GIT_DEPTH: "0"

default:
  tags:
    - aws
    - eks
    - dairun

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

runner-check:
  stage: validate
  script:
    - echo "DAI RUN GitLab Runner connected"
    - docker --version
    - aws --version
    - git --version

detect-changed-services:
  stage: validate
  script:
    - ./ci/detect-changed-services.sh
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - ci-output/changed-files.txt
      - ci-output/changed-services.tsv

unit-test-changed-services:
  stage: test
  needs:
    - job: detect-changed-services
      artifacts: true
  script:
    - ./ci/test-changed-services.sh

sonarqube-check:
  stage: quality
  allow_failure: true
  script:
    - >
      docker run --rm
      --network host
      -e SONAR_HOST_URL
      -e SONAR_TOKEN
      -e SONAR_USER_HOME=/tmp/.sonar
      -v "$CI_PROJECT_DIR:/usr/src"
      -w /usr/src
      sonarsource/sonar-scanner-cli:latest
      -Dsonar.qualitygate.wait=false

build-push-and-update-gitops:
  stage: deploy
  needs:
    - job: detect-changed-services
      artifacts: true
    - job: unit-test-changed-services
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  resource_group: production-gitops
  interruptible: false
  timeout: 2h
  script:
    - ./ci/build-push-and-update-gitops.sh
