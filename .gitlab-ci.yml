stages:
  - validate
  - test
  - quality
  - deploy

variables:
  AWS_DEFAULT_REGION: ap-northeast-2
  ECR_REGISTRY: 970307871446.dkr.ecr.ap-northeast-2.amazonaws.com
  GITOPS_REPOSITORY_URL: http://10.20.0.253/dai-run/gitops.git
  GIT_DEPTH: "0"
  # Pinned release tag. Mirror and digest-pin this image in ECR after the first validated run.
  TRIVY_IMAGE: public.ecr.aws/aquasecurity/trivy:0.72.0
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivy-cache"

default:
  tags:
    - aws
    - eks
    - dairun

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

runner-check:
  stage: validate
  script:
    - echo "DAI RUN GitLab Runner connected"
    - docker --version
    - aws --version
    - git --version
    - curl --version
    - jq --version

detect-changed-services:
  stage: validate
  script:
    - ./ci/detect-changed-services.sh
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - ci-output/changed-files.txt
      - ci-output/changed-services.tsv

unit-test-changed-services:
  stage: test
  needs:
    - job: detect-changed-services
      artifacts: true
  script:
    - ./ci/test-changed-services.sh

sonarqube-check:
  stage: quality
  allow_failure: true
  script:
    - >
      docker run --rm
      --network host
      -e SONAR_HOST_URL
      -e SONAR_TOKEN
      -e SONAR_USER_HOME=/tmp/.sonar
      -v "$CI_PROJECT_DIR:/usr/src"
      -w /usr/src
      sonarsource/sonar-scanner-cli:latest
      -Dsonar.qualitygate.wait=false
      -Dsonar.qualitygate.timeout=600
  after_script:
    - ./ci/report-sonarqube-gate.sh

build-push-and-update-gitops:
  stage: deploy
  needs:
    - job: detect-changed-services
      artifacts: true
    - job: unit-test-changed-services
    - job: sonarqube-check
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^demo\/video-purple-auto-/'
  resource_group: production-gitops
  interruptible: false
  timeout: 2h
  cache:
    key: trivy-db-v1
    paths:
      - .trivy-cache/
    policy: pull-push
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-output/trivy/
  script:
    - ./ci/build-push-and-update-gitops.sh

.demo-frontend-build:
  stage: deploy
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_CD_DEMO == "true"'
      when: manual
    - when: never
  resource_group: cicd-demo-frontend
  interruptible: false
  timeout: 1h
  cache:
    key: trivy-db-v1
    paths:
      - .trivy-cache/
    policy: pull-push
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ci-output/demo/
    reports:
      dotenv: ci-output/demo/image.env

demo-frontend-cold-build:
  extends: .demo-frontend-build
  variables:
    DEMO_CACHE_MODE: "cold"
  script:
    - ./ci/demo-frontend-build.sh

demo-frontend-warm-build:
  extends: .demo-frontend-build
  variables:
    DEMO_CACHE_MODE: "warm"
  script:
    - ./ci/demo-frontend-build.sh