stages:
  - test
  - quality

runner-test:
  stage: test
  tags:
    - aws
    - eks
    - dairun
  script:
    - echo "DAI RUN GitLab Runner connected"
    - hostname
    - whoami
    - docker --version
    - aws --version

sonarqube-check:
  stage: quality
  tags:
    - aws
    - eks
    - dairun
  variables:
    GIT_DEPTH: "0"
  script:
    - >
      docker run --rm
      --network host
      --user "$(id -u):$(id -g)"
      -e SONAR_HOST_URL
      -e SONAR_TOKEN
      -e SONAR_USER_HOME=/tmp/.sonar
      -v "$CI_PROJECT_DIR:/usr/src"
      -w /usr/src
      sonarsource/sonar-scanner-cli:latest
      -Dsonar.qualitygate.wait=true
