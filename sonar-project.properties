sonar.projectKey=dai-run
sonar.projectName=DAI-RUN
sonar.sourceEncoding=UTF-8

# 1차 분석 범위: Next.js, Node.js MSA/consumer, Python AI 서비스
# Java ai-service는 JDK 17 빌드 산출물을 제공하는 2차 단계에서 포함한다.
sonar.sources=app,components,lib,types,services,services-msa,ai,db,scripts,instrumentation.ts,middleware.ts
sonar.tests=ai/ai-shoe-life
sonar.test.inclusions=ai/ai-shoe-life/test_*.py

sonar.exclusions=\
  ai/ai-shoe-life/test_*.py,\
  **/node_modules/**,\
  **/.next/**,\
  **/out/**,\
  **/build/**,\
  **/dist/**,\
  **/coverage/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  **/*.min.js,\
  **/*.d.ts,\
  db/**/*.sql,\
  db/seed-*.mjs,\
  db/enrich-*.mjs,\
  db/ingest-*.mjs,\
  db/regenerate-*.mjs
