apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dir-challenge-weekly-scheduler-secret-eso-shadow-v1
  namespace: dir-backend-ns
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: dir-challenge-weekly-scheduler
    app.kubernetes.io/part-of: dai-run
    dairun.io/change-scope: backend-db-shadow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secretsmanager-backend-worker-shadow
  target:
    name: dir-challenge-weekly-scheduler-secret-eso-shadow-v1
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: dir-challenge-weekly-scheduler
          app.kubernetes.io/part-of: dai-run
          dairun.io/change-scope: backend-db-shadow
  dataFrom:
    - extract:
        key: dai-run/prod/dir-backend-ns/dir-challenge-weekly-scheduler-secret
---
