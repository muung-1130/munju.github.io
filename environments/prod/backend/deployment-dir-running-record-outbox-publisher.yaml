apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: publisher
    app.kubernetes.io/name: dir-running-record-outbox-publisher
    app.kubernetes.io/part-of: dai-run
    dairun.io/workload-class: app
  name: dir-running-record-outbox-publisher
  namespace: dir-backend-ns
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dir-running-record-outbox-publisher
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-08-07T16:35:20+09:00'
      labels:
        app.kubernetes.io/component: publisher
        app.kubernetes.io/name: dir-running-record-outbox-publisher
        app.kubernetes.io/part-of: dai-run
        dairun.io/workload-class: app
    spec:
      nodeSelector:
        workload: app
      containers:
      - command:
        - npx
        - tsx
        - src/consumer.ts
        env:
        - name: OTEL_SERVICE_NAME
          value: dir-running-record-outbox-publisher
        - name: MESSAGING_PROVIDER
          value: sns-sqs
        - name: RUNNING_EVENTS_TOPIC_ARN
          value: arn:aws:sns:ap-northeast-2:970307871446:dir-prod-running-events
        - name: PGHOST
          value: dir-postgresql-rw.dir-db-ns.svc
        envFrom:
        - configMapRef:
            name: dir-running-record-outbox-publisher-config
        - secretRef:
            name: dir-running-record-outbox-publisher-secret
        - secretRef:
            name: dir-running-record-db-secret
        image: 970307871446.dkr.ecr.ap-northeast-2.amazonaws.com/dai-run/running-record-service@sha256:f5d00203afde294e0fb65aead1907583114cba5505b97f50472c27af702b23b2
        imagePullPolicy: IfNotPresent
        name: dir-running-record-outbox-publisher
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 512Mi
            memory: 256Mi
          requests:
            cpu: 25m
            ephemeral-storage: 64Mi
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: dir-running-record-outbox-publisher-sa
      serviceAccountName: dir-running-record-outbox-publisher-sa
      terminationGracePeriodSeconds: 60
      volumes:
      - emptyDir:
          sizeLimit: 32Mi
        name: tmp
