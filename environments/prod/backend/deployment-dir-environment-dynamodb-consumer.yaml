apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: consumer
    app.kubernetes.io/name: dir-environment-dynamodb-consumer
    app.kubernetes.io/part-of: dai-run
    dairun.io/workload-class: app
  name: dir-environment-dynamodb-consumer
  namespace: dir-backend-ns
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dir-environment-dynamodb-consumer
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: consumer
        app.kubernetes.io/name: dir-environment-dynamodb-consumer
        app.kubernetes.io/part-of: dai-run
        dairun.io/workload-class: app
    spec:
      nodeSelector:
        workload: app
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: dir-environment-dynamodb-consumer
        envFrom:
        - configMapRef:
            name: dir-environment-dynamodb-consumer-config
        - secretRef:
            name: dir-environment-dynamodb-consumer-secret-eso-shadow-v1
        image: 970307871446.dkr.ecr.ap-northeast-2.amazonaws.com/dai-run/environment-consumer@sha256:a27a7f30f2a7fcb78ade640777941c6d5d6e46d9734264b8478cfa431a9be1fb
        imagePullPolicy: IfNotPresent
        name: dir-environment-dynamodb-consumer
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 512Mi
            memory: 256Mi
          requests:
            cpu: 25m
            ephemeral-storage: 64Mi
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: dir-environment-dynamodb-consumer-sa
      serviceAccountName: dir-environment-dynamodb-consumer-sa
      terminationGracePeriodSeconds: 60
      volumes:
      - emptyDir:
          sizeLimit: 32Mi
        name: tmp
