apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: dir-notification
    app.kubernetes.io/part-of: dai-run
    dairun.io/availability: standard
    dairun.io/workload-class: app
  name: dir-notification
  namespace: dir-backend-ns
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dir-notification
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-08-07T16:35:19+09:00'
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/name: dir-notification
        app.kubernetes.io/part-of: dai-run
        dairun.io/availability: standard
        dairun.io/workload-class: app
    spec:
      nodeSelector:
        workload: app
      containers:
      - env:
        - name: PORT
          value: '8112'
        - name: OTEL_SERVICE_NAME
          value: dir-notification
        envFrom:
        - configMapRef:
            name: dir-notification-config
        - secretRef:
            name: dir-notification-secret
        - secretRef:
            name: dir-notification-db-secret
        image: 970307871446.dkr.ecr.ap-northeast-2.amazonaws.com/dai-run/notification-service@sha256:a5c718b95eb1d2f34af37754d34429fe60845a549f98083520890330c50e6b9c
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 3
        name: dir-notification
        ports:
        - containerPort: 8112
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 512Mi
          requests:
            cpu: 30m
            ephemeral-storage: 128Mi
            memory: 160Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: dir-notification-sa
      serviceAccountName: dir-notification-sa
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
