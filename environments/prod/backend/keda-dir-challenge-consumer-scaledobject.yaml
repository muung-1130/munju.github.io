{
  "apiVersion": "keda.sh/v1alpha1",
  "kind": "ScaledObject",
  "metadata": {
    "labels": {
      "app.kubernetes.io/name": "dir-challenge-consumer",
      "app.kubernetes.io/part-of": "dai-run",
      "scaledobject.keda.sh/name": "dir-challenge-consumer-scaledobject"
    },
    "name": "dir-challenge-consumer-scaledobject",
    "namespace": "dir-backend-ns"
  },
  "spec": {
    "advanced": {
      "horizontalPodAutoscalerConfig": {
        "behavior": {
          "scaleUp": {
            "stabilizationWindowSeconds": 0
          }
        }
      },
      "scalingModifiers": {}
    },
    "cooldownPeriod": 300,
    "maxReplicaCount": 8,
    "minReplicaCount": 0,
    "pollingInterval": 30,
    "scaleTargetRef": {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "name": "dir-challenge-consumer"
    },
    "triggers": [
      {
        "authenticationRef": {
          "name": "dir-backend-consumers-aws"
        },
        "metadata": {
          "activationQueueLength": "0",
          "awsRegion": "ap-northeast-2",
          "queueLength": "1",
          "queueURL": "https://sqs.ap-northeast-2.amazonaws.com/970307871446/dir-prod-challenge-run-completed-q",
          "scaleOnDelayed": "false",
          "scaleOnInFlight": "true"
        },
        "type": "aws-sqs-queue"
      }
    ]
  }
}
