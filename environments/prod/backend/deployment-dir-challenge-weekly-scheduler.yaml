apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/name: dir-challenge-weekly-scheduler
    app.kubernetes.io/part-of: dai-run
    dairun.io/workload-class: app
  name: dir-challenge-weekly-scheduler
  namespace: dir-backend-ns
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dir-challenge-weekly-scheduler
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-08-07T16:35:18+09:00'
      labels:
        app.kubernetes.io/component: scheduler
        app.kubernetes.io/name: dir-challenge-weekly-scheduler
        app.kubernetes.io/part-of: dai-run
        dairun.io/workload-class: app
    spec:
      nodeSelector:
        workload: app
      containers:
      - env:
        - name: OTEL_SERVICE_NAME
          value: dir-challenge-weekly-scheduler
        - name: PGHOST
          value: dir-postgresql-rw.dir-db-ns.svc
        envFrom:
        - configMapRef:
            name: dir-challenge-weekly-scheduler-config
        - secretRef:
            name: dir-challenge-weekly-scheduler-secret-eso-shadow-v1
        image: 970307871446.dkr.ecr.ap-northeast-2.amazonaws.com/dai-run/challenge-weekly-scheduler@sha256:a4afcc1009cf38ba1cb026985ecbc2df0cfafa02b5e3c37bf3a46fc5281516b5
        imagePullPolicy: IfNotPresent
        name: dir-challenge-weekly-scheduler
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 512Mi
            memory: 256Mi
          requests:
            cpu: 25m
            ephemeral-storage: 64Mi
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: dir-challenge-weekly-scheduler-sa
      serviceAccountName: dir-challenge-weekly-scheduler-sa
      terminationGracePeriodSeconds: 60
      volumes:
      - emptyDir:
