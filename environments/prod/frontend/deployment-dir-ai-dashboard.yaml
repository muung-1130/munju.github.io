apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/name: dir-ai-dashboard
    app.kubernetes.io/part-of: dai-run
    dairun.io/workload-class: app
  name: dir-ai-dashboard
  namespace: dir-frontend-ns
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dir-ai-dashboard
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/name: dir-ai-dashboard
        app.kubernetes.io/part-of: dai-run
        dairun.io/workload-class: app
    spec:
      nodeSelector:
        workload: app
      containers:
        - name: dir-ai-dashboard
          image: 970307871446.dkr.ecr.ap-northeast-2.amazonaws.com/dai-run/ai-dashboard@sha256:3d4e02ac01d04fa03a642d62889011c528f86967adde39704e48207fc09f0a7d
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: OTEL_SERVICE_NAME
              value: dir-ai-dashboard
          envFrom:
            - configMapRef:
                name: dir-ai-dashboard-config
            - secretRef:
                name: dir-ai-dashboard-secret
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 3
          startupProbe:
            failureThreshold: 24
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              ephemeral-storage: 128Mi
              memory: 256Mi
            limits:
              cpu: 500m
              ephemeral-storage: 1Gi
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /app/.next/cache
              name: next-cache
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: dir-ai-dashboard-sa
      serviceAccountName: dir-ai-dashboard-sa
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir:
            sizeLimit: 64Mi
          name: tmp
        - emptyDir:
            sizeLimit: 128Mi
          name: next-cache
