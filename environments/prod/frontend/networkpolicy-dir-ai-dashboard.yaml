apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dir-ai-dashboard-allow-ambient-probe
  namespace: dir-frontend-ns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dir-ai-dashboard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 169.254.7.127/32
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dir-ai-dashboard-allow-gateway
  namespace: dir-frontend-ns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dir-ai-dashboard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dir-istio-ingress
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 15008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dir-ai-dashboard-allow-dns
  namespace: dir-frontend-ns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dir-ai-dashboard
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.25.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
