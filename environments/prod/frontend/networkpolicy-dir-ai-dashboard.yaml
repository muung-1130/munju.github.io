    matchLabels:
      app.kubernetes.io/name: dir-ai-dashboard
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 172.20.0.1/32
      ports:
        - protocol: TCP
          port: 443
