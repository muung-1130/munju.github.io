apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dir-course-recommendation-secret-eso-shadow-v1
  namespace: dir-ai-ns
  labels:
    app.kubernetes.io/name: dir-course-recommendation
    app.kubernetes.io/part-of: dai-run
    dairun.io/change-scope: db-shadow-canary
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secretsmanager-course-recommendation-shadow
  target:
    name: dir-course-recommendation-secret-eso-shadow-v1
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: dir-course-recommendation
          app.kubernetes.io/part-of: dai-run
          dairun.io/change-scope: db-shadow-canary
  dataFrom:
    - extract:
        key: dai-run/prod/dir-ai-ns/dir-course-recommendation-secret
