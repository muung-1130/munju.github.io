apiVersion: apps/v1
kind: Deployment
metadata:
  name: dai-run-crew-service-green
  labels:
    app.kubernetes.io/name: dai-run-crew-service-green
    app.kubernetes.io/part-of: dai-run
    app.kubernetes.io/component: crew-service
    dairun.io/track: green
spec:
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dai-run-crew-service-green
      dairun.io/track: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dai-run-crew-service-green
        app.kubernetes.io/part-of: dai-run
        app.kubernetes.io/component: crew-service
        dairun.io/track: green
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-dai-run-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crew-service
          image: harbor.dai-run.internal/dai-run/crew-service@sha256:6a4bdab303fa5964afcc3702c1cffab3d284a7f5deef385e65b3d1d26d31904e
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8104"
          ports:
            - name: http
              containerPort: 8104
              protocol: TCP
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL