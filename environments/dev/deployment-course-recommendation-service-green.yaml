apiVersion: apps/v1
kind: Deployment
metadata:
  name: dai-run-course-recommendation-service-green
  labels:
    app.kubernetes.io/name: dai-run-course-recommendation-service-green
    app.kubernetes.io/part-of: dai-run
    app.kubernetes.io/component: course-recommendation-service
    dairun.io/track: green
spec:
  replicas: 0
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dai-run-course-recommendation-service-green
      dairun.io/track: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dai-run-course-recommendation-service-green
        app.kubernetes.io/part-of: dai-run
        app.kubernetes.io/component: course-recommendation-service
        dairun.io/track: green
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-dai-run-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: course-recommendation-service
          image: harbor.dai-run.internal/dai-run/course-recommendation-service@sha256:be8d4bd65e17c6500621909bc28a4ffa2468e384d12c0cd6f4c7ee418c3af052
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8201"
          ports:
            - name: http
              containerPort: 8201
              protocol: TCP
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL