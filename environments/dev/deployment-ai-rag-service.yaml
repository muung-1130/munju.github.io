apiVersion: apps/v1
kind: Deployment
metadata:
  name: dai-run-ai-rag-service
  labels:
    app.kubernetes.io/name: dai-run-ai-rag-service
    app.kubernetes.io/part-of: dai-run
    app.kubernetes.io/component: ai-rag-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dai-run-ai-rag-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dai-run-ai-rag-service
        app.kubernetes.io/part-of: dai-run
        app.kubernetes.io/component: ai-rag-service
        dairun.io/track: blue
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-dai-run-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-rag-service
          image: harbor.dai-run.internal/dai-run/ai-rag-service@sha256:4f0d138a28d1025fa2e80861347fe1ea5a019c6caa851119440fcad9bfb17c2b
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dai-run-ai-rag-service-config
            - secretRef:
                name: dai-run-ai-rag-service-db
            - secretRef:
                name: dai-run-ai-rag-service-aws
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
