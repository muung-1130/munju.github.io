apiVersion: apps/v1
kind: Deployment
metadata:
  name: dai-run-auth-service
  labels:
    app.kubernetes.io/name: dai-run-auth-service
    app.kubernetes.io/part-of: dai-run
    app.kubernetes.io/component: auth-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dai-run-auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dai-run-auth-service
        app.kubernetes.io/part-of: dai-run
        app.kubernetes.io/component: auth-service
        dairun.io/track: blue
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-dai-run-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: harbor.dai-run.internal/dai-run/auth-service@sha256:a1dd726d86bc4d11b1902a69b896f2a2ec3cab8f2e2d2227c6c858e67573950a
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8101"
          ports:
            - name: http
              containerPort: 8101
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
