apiVersion: apps/v1
kind: Deployment
metadata:
  name: dai-run-marathon-service
  labels:
    app.kubernetes.io/name: dai-run-marathon-service
    app.kubernetes.io/part-of: dai-run
    app.kubernetes.io/component: marathon-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dai-run-marathon-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dai-run-marathon-service
        app.kubernetes.io/part-of: dai-run
        app.kubernetes.io/component: marathon-service
        dairun.io/track: blue
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-dai-run-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: marathon-service
          image: harbor.dai-run.internal/dai-run/marathon-service@sha256:18e447edadeca9e1a7fe1572d76db826a7f3a9226d1050d948ef5914a5a8d002
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8111"
          ports:
            - name: http
              containerPort: 8111
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
