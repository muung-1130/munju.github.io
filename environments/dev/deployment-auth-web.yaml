apiVersion: apps/v1
kind: Deployment
metadata:
  name: dai-run-auth-web
  labels:
    app.kubernetes.io/name: dai-run-auth-web
    app.kubernetes.io/part-of: dai-run
    app.kubernetes.io/component: auth-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dai-run-auth-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dai-run-auth-web
        app.kubernetes.io/part-of: dai-run
        app.kubernetes.io/component: auth-web
        dairun.io/track: blue
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-dai-run-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-web
          image: harbor.dai-run.internal/dai-run/auth-web@sha256:a31b98064f6ac3ebf7516ba44ac8257644a8769c5cea79d773111f236ae5857b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
